[package]
name = "gray-permissions"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Gate gray tool calls behind permission modes and host approval prompts"

[[bin]]
name = "permissions"
path = "src/main.rs"

[lib]
name = "gray_permissions"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
